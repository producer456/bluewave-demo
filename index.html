<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Wave — App Demo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #16394f 0%, #0d2331 55%, #081820 100%);
    font-family:-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:24px;
  }
  .caption{color:#9fc3d4;font-size:13px;letter-spacing:.4px;text-align:center}
  .caption b{color:#e8f4fa;font-weight:600}
  /* phone shell — sized like a real handset, shrinks to fit short windows */
  .phone{
    height:min(calc(100vh - 110px), 852px);
    aspect-ratio: 393 / 852;
    background:#0b0d10;
    border-radius:44px;
    padding:12px;
    position:relative;
    box-shadow:
      0 0 0 2px #2b333a,
      0 30px 60px rgba(0,0,0,.55),
      0 4px 14px rgba(0,0,0,.4),
      inset 0 0 4px rgba(255,255,255,.08);
  }
  .phone::before{ /* punch-hole camera */
    content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);
    width:12px;height:12px;border-radius:50%;
    background:#000;box-shadow:inset 0 0 2px 1px #1c2126, 0 0 0 2px #14181c;
    z-index:2;pointer-events:none;
  }
  .phone::after{ /* side button */
    content:"";position:absolute;right:-4px;top:24%;
    width:4px;height:64px;border-radius:2px;background:#2b333a;
  }
  .screen{
    width:100%;height:100%;
    border-radius:32px;overflow:hidden;background:#eaf4f9;
  }
  .screen iframe{width:100%;height:100%;border:0;display:block}
  /* on an actual phone, drop the bezel and go full screen */
  @media (max-width:560px), (max-height:560px) and (pointer:coarse){
    body{padding:0;gap:0}
    .caption{display:none}
    .phone{height:100%;width:100%;aspect-ratio:auto;border-radius:0;padding:0;box-shadow:none}
    .phone::before,.phone::after{display:none}
    .screen{border-radius:0}
  }
</style>
</head>
<body>
  <div class="phone"><div class="screen">
    <iframe src="app.html" title="Blue Wave app demo"></iframe>
  </div></div>
  <p class="caption"><b>Blue Wave</b> — mobile app demo · tap around, everything works like the phone app</p>
</body>
</html>
